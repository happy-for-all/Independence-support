name: Simulator Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 👑 セクション：Cloudflare用に一時的にdistフォルダを作ってHTMLを入れる
    # 👑 セクション：ロリポップのパスと完全に一致させるため、フォルダを作ってコピーする
    - name: Prepare Deployment Directory
      run: |
        mkdir -p dist/independence-support
        cp index.html dist/independence-support/

    - name: Deploy to Cloudflare Workers
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: npx wrangler deploy
